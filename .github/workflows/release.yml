name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    name: Build demo frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build demo
        run: pnpm build:demo
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-dist
          path: apps/demo/dist/
          retention-days: 7

  deploy:
    name: Deploy to jeeflow-demo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: demo-dist
          path: dist/
      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: dist/
          target: /java_projects/jeeflow/demo-ui/
          strip_components: 1
          overwrite: true
          rm: true

  publish:
    name: Publish @mldong/jeeflow-ui to npm
    runs-on: ubuntu-latest
    # npm Trusted Publishing（OIDC）：id-token 让 Actions 领一次性身份令牌，
    # npm 按包页面登记的"可信发布者"（本仓 + 本文件）当场铸短期发布凭证 ⇒ 仓里不存长期 token。
    # 撤销这条路＝改回 env NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} 并去掉 id-token。
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # node 22 自带 npm 10.9.x，低于 Trusted Publishing 要求的 11.5.1 ⇒ 显式抬代次
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11
      - name: Show toolchain
        run: node --version && npm --version
      - name: Install dependencies
        run: pnpm install
      - name: Build ui-kit
        run: pnpm build:kit
      - name: Verify build artifacts
        run: |
          ls -l packages/ui-kit/dist/
          test -f packages/ui-kit/dist/jeeflow-ui.js
          test -f packages/ui-kit/dist/jeeflow-ui.umd.cjs
          test -f packages/ui-kit/dist/index.d.ts
      - name: Pack dry-run
        run: |
          cd packages/ui-kit
          npm pack --dry-run
      - name: Publish to npm
        working-directory: packages/ui-kit
        run: npm publish --access=public
