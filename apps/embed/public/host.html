<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宿主示例 · jeeflow embed 接入样板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font: 14px/1.6 system-ui, -apple-system, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e8eaed; flex-shrink: 0; }
    header h1 { font-size: 15px; }
    header .hint { color: #9ca3af; font-size: 12px; }
    .actions { margin-left: auto; display: flex; gap: 8px; }
    button { padding: 5px 12px; border-radius: 6px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; font-size: 12px; }
    button:hover { border-color: #1677ff; color: #1677ff; }
    .body { flex: 1; min-height: 0; display: flex; }
    iframe { flex: 1; border: none; background: #fff; }
    aside { width: 320px; background: #1f2937; color: #d1d5db; overflow-y: auto; padding: 12px; font: 12px/1.7 ui-monospace, Consolas, monospace; }
    aside h2 { color: #fff; font-size: 13px; margin-bottom: 8px; }
    .msg { border-bottom: 1px dashed #374151; padding: 4px 0; word-break: break-all; }
    .msg .t { color: #60a5fa; }
  </style>
</head>
<body>
  <header>
    <h1>宿主系统示例（异栈接入样板）</h1>
    <span class="hint">右侧为 postMessage 事件日志</span>
    <div class="actions">
      <button onclick="setOperator('leader')">切换为 李四(组长)</button>
      <button onclick="setOperator('user1')">切换为 张三</button>
      <button onclick="retheme('#722ed1')">紫主题</button>
      <button onclick="retheme('#1677ff')">蓝主题</button>
    </div>
  </header>
  <div class="body">
    <!-- iframe 嵌入：URL 参数注入登录态/后端/白标 -->
    <iframe id="wf" src="/?backend=http%3A%2F%2Flocalhost%3A8082&operator=user1&site=Acme%20OA&theme=%231677ff"></iframe>
    <aside>
      <h2>postMessage 日志</h2>
      <div id="log"></div>
    </aside>
  </div>
  <script>
    const iframe = document.getElementById('wf')
    const log = document.getElementById('log')

    // 接收 embed 壳上报：ready / event / todo-count
    window.addEventListener('message', (e) => {
      const d = e.data
      if (!d || typeof d !== 'object' || !String(d.type || '').startsWith('jeeflow:')) return
      const div = document.createElement('div')
      div.className = 'msg'
      div.innerHTML = '<span class="t">' + d.type + '</span> ' + JSON.stringify({ ...d, type: undefined })
      log.prepend(div)
      while (log.children.length > 60) log.removeChild(log.lastChild)
    })

    // 宿主 → embed：局部切换操作人
    function setOperator(operator) {
      iframe.contentWindow.postMessage({ type: 'jeeflow:setOperator', operator }, '*')
    }
    // 宿主 → embed：白标热更新（主题色/站点名）
    function retheme(primary) {
      iframe.contentWindow.postMessage({ type: 'jeeflow:init', theme: { primary, siteName: 'Acme OA' } }, '*')
    }
  </script>
</body>
</html>
